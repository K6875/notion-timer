<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notion Kiné Timer</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0b0b0c; color:#fff; }
    .card { width:min(560px, 94vw); padding:20px; border:1px solid #222; border-radius:16px; background:#111; }
    .top { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:10px; opacity:.9; }
    .label { font-size:14px; }
    .title { font-size:16px; font-weight:650; }
    .phase { font-size:14px; opacity:.85; text-align:center; margin-top:6px; }
    .time { font-size:64px; font-weight:800; letter-spacing:1px; text-align:center; margin:12px 0 10px; }
    .meta { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; font-size:13px; opacity:.75; }
    .pill { border:1px solid #2a2a2a; background:#171717; padding:6px 10px; border-radius:999px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
    button {
      border:1px solid #2a2a2a; background:#171717; color:#fff;
      padding:10px 14px; border-radius:12px; font-size:14px; cursor:pointer;
    }
    button.primary { background:#2b2bff; border-color:#2b2bff; }
    select, input {
      border:1px solid #2a2a2a; background:#0f0f10; color:#fff;
      padding:10px 12px; border-radius:12px; font-size:14px;
    }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:12px; }
    .hint { margin-top:12px; font-size:12px; opacity:.65; text-align:center; line-height:1.35; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div>
          <div class="title" id="label">Timer kiné</div>
          <div class="label" id="subtitle">Guidé (répétitions + pauses)</div>
        </div>
        <div class="label" id="status">Prêt</div>
      </div>

      <div class="time" id="display">00:15</div>
      <div class="phase" id="phase">Phase : Travail</div>

      <div class="meta">
        <div class="pill" id="counter">Série 1/4</div>
        <div class="pill" id="modePill">Mode : Étirement</div>
      </div>

      <div class="row">
        <button class="primary" id="start">Start</button>
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>
      </div>

      <div class="grid">
        <div>
          <div class="label" style="margin:6px 0 6px;">Mode</div>
          <select id="mode">
            <option value="stretch">Étirement (15s + repos × 4)</option>
            <option value="lr">Gauche / Droite (15s G + switch + 15s D × 3)</option>
            <option value="move">Mouvements (30–40s + repos × 4)</option>
          </select>
        </div>

        <div>
          <div class="label" style="margin:6px 0 6px;">Réglages (mode mouvements)</div>
          <div class="row" style="justify-content:flex-start; margin-top:0;">
            <input id="work" type="number" min="10" max="180" value="40" style="width:110px;" />
            <input id="rest" type="number" min="0" max="180" value="10" style="width:110px;" />
            <input id="sets" type="number" min="1" max="10" value="4" style="width:110px;" />
          </div>
          <div class="label" style="opacity:.65; margin-top:6px;">work / rest / séries (sec)</div>
        </div>
      </div>

      <div class="hint">
        URLs utiles :<br>
        <b>?mode=stretch&label=Exo%201</b> • <b>?mode=lr&label=Exo%202</b> •
        <b>?mode=move&work=40&rest=10&sets=4&label=Exo%203</b>
      </div>
    </div>
  </div>

<script>
  const qs = new URLSearchParams(location.search);

  // --------- Helpers
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => {
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
  };
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.05;
      o.connect(g); g.connect(ctx.destination);
      o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 220);
    } catch(e) {}
  }

  // --------- Label from URL
  const label = qs.get('label') || 'Timer kiné';
  $('label').textContent = label;

  // --------- Default configs (based on your kiné notes)
  // stretch: 15s hold + 10s rest, 4 times
  const defaultStretch = { hold: 15, rest: 10, sets: 4 };

  // lr: 15s left + 5s switch + 15s right + 10s rest, repeated 3 times
  const defaultLR = { left: 15, switch: 5, right: 15, rest: 10, sets: 3 };

  // move: work/rest for 3-4 sets (default 40/10 x 4)
  const defaultMove = { work: 40, rest: 10, sets: 4 };

  // --------- Build a "sequence" of phases (in seconds) depending on mode
  // Each phase: { name, seconds }
  function buildSequence(mode, cfg) {
    if (mode === 'stretch') {
      const seq = [];
      for (let i=0; i<cfg.sets; i++) {
        seq.push({ name: 'Travail (maintien)', seconds: cfg.hold });
        if (i !== cfg.sets - 1 && cfg.rest > 0) seq.push({ name: 'Repos', seconds: cfg.rest });
      }
      return seq;
    }
    if (mode === 'lr') {
      const seq = [];
      for (let i=0; i<cfg.sets; i++) {
        seq.push({ name: 'Gauche (maintien)', seconds: cfg.left });
        if (cfg.switch > 0) seq.push({ name: 'Switch', seconds: cfg.switch });
        seq.push({ name: 'Droite (maintien)', seconds: cfg.right });
        if (i !== cfg.sets - 1 && cfg.rest > 0) seq.push({ name: 'Repos', seconds: cfg.rest });
      }
      return seq;
    }
    // move
    const seq = [];
    for (let i=0; i<cfg.sets; i++) {
      seq.push({ name: 'Travail (mouvements)', seconds: cfg.work });
      if (i !== cfg.sets - 1 && cfg.rest > 0) seq.push({ name: 'Repos', seconds: cfg.rest });
    }
    return seq;
  }

  // --------- State
  let timer = null;
  let currentMode = 'stretch';
  let sequence = [];
  let phaseIndex = 0;
  let remaining = 0;
  let totalSets = 4;
  let doneSets = 1;

  function updatePills() {
    $('modePill').textContent =
      'Mode : ' + (currentMode === 'stretch' ? 'Étirement' : currentMode === 'lr' ? 'Gauche/Droite' : 'Mouvements');

    // Approx "set" counter (for display):
    // We recompute doneSets based on how many "work phases" have been completed
    const workNames = new Set(['Travail (maintien)', 'Gauche (maintien)', 'Droite (maintien)', 'Travail (mouvements)']);
    let completedWork = 0;
    for (let i=0; i<phaseIndex; i++) if (workNames.has(sequence[i].name)) completedWork++;

    if (currentMode === 'lr') {
      // One LR "set" = left+right work phases (=2 work phases)
      doneSets = Math.min(totalSets, Math.floor(completedWork / 2) + 1);
    } else {
      // One set = 1 work phase
      doneSets = Math.min(totalSets, completedWork + 1);
    }
    $('counter').textContent = `Série ${doneSets}/${totalSets}`;
  }

  function render() {
    $('display').textContent = fmt(remaining);
    $('phase').textContent = 'Phase : ' + (sequence[phaseIndex]?.name || '—');
    updatePills();
  }

  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  function running() { return !!timer; }

  function resetToStart() {
    stop();
    phaseIndex = 0;
    remaining = sequence[0]?.seconds ?? 15;
    $('status').textContent = 'Prêt';
    render();
  }

  function nextPhase() {
    beep();
    phaseIndex++;
    if (phaseIndex >= sequence.length) {
      stop();
      $('status').textContent = 'Terminé';
      // show 00:00
      remaining = 0;
      $('display').textContent = fmt(0);
      $('phase').textContent = 'Phase : Terminé';
      $('counter').textContent = `Série ${totalSets}/${totalSets}`;
      return;
    }
    remaining = sequence[phaseIndex].seconds;
    render();
  }

  function tick() {
    remaining = Math.max(0, remaining - 1);
    $('display').textContent = fmt(remaining);
    if (remaining === 0) nextPhase();
  }

  function applyModeFromUI() {
    const mode = $('mode').value;
    currentMode = mode;

    // Move settings
    const work = Math.max(10, parseInt($('work').value || '40', 10));
    const rest = Math.max(0, parseInt($('rest').value || '10', 10));
    const sets = Math.max(1, parseInt($('sets').value || '4', 10));

    let cfg;
    if (mode === 'stretch') {
      cfg = { ...defaultStretch };
      totalSets = cfg.sets;
    } else if (mode === 'lr') {
      cfg = { ...defaultLR };
      totalSets = cfg.sets;
    } else {
      cfg = { ...defaultMove, work, rest, sets };
      totalSets = cfg.sets;
    }

    sequence = buildSequence(mode, cfg);
    resetToStart();
  }

  // --------- Init from URL
  (function initFromURL(){
    const mode = (qs.get('mode') || 'stretch').toLowerCase();
    const work = parseInt(qs.get('work') || defaultMove.work, 10);
    const rest = parseInt(qs.get('rest') || defaultMove.rest, 10);
    const sets = parseInt(qs.get('sets') || defaultMove.sets, 10);

    $('mode').value = (mode === 'lr' || mode === 'move' || mode === 'stretch') ? mode : 'stretch';
    $('work').value = String(isFinite(work) ? work : defaultMove.work);
    $('rest').value = String(isFinite(rest) ? rest : defaultMove.rest);
    $('sets').value = String(isFinite(sets) ? sets : defaultMove.sets);

    applyModeFromUI();
  })();

  // --------- Events
  $('start').onclick = () => {
    if (running()) return;
    $('status').textContent = 'En cours';
    timer = setInterval(tick, 1000);
  };

  $('pause').onclick = () => {
    if (!running()) return;
    stop();
    $('status').textContent = 'Pause';
  };

  $('reset').onclick = () => applyModeFromUI();

  $('mode').onchange = () => applyModeFromUI();
  $('work').onchange = () => { if ($('mode').value === 'move') applyModeFromUI(); };
  $('rest').onchange = () => { if ($('mode').value === 'move') applyModeFromUI(); };
  $('sets').onchange = () => { if ($('mode').value === 'move') applyModeFromUI(); };
</script>
</body>
</html>
